      // Typing animation for placeholder (pause during loading/results to avoid jank)
      React.useEffect(function() {
        // Pause animation while input is focused, results visible, or loading
        if (isFocused || isLoading || showResult) {
          return function() {};
        }
        var i = 0;
        var j = 0;
        var deleting = false;
        var active = demoPhrases[0] || '';
        function tick() {
          if (!deleting) {
            setPlaceholder(active.slice(0, i + 1));
            i++;
            if (i >= active.length + 8) deleting = true;
          } else {
            setPlaceholder(active.slice(0, Math.max(0, i - 1)));
            i--;
            if (i <= 0) {
              deleting = false;
              j = (j + 1) % demoPhrases.length;
              active = demoPhrases[j];
            }
          }

        // On mount: if URL has ?song=&artist=, auto-run search
        React.useEffect(function(){
          try {
            var params = new URLSearchParams(window.location.search);
            var qs = (params.get('song') || '').trim();
            var qa = (params.get('artist') || '').trim();
            if (qs) {
              var inputStr = qa ? (qs + ' - ' + qa) : qs;
              setSong(inputStr);
              setPlaceholder('');
              setShowResult(true);
              setTimeout(function(){ handleSearch(qs, qa); }, 0);
            }
          } catch(e) {}
        }, []);

        }
        var id = setInterval(tick, 65);
        return function() { clearInterval(id); };
      }, [isFocused, isLoading, showResult]);

      function parseQuery(text) {
        var t = (text || '').trim();
        if (!t) return { song: '', artist: '' };
        var cleaned = t.replace(/["""']/g, '').replace(/[–—]/g, '-');
        if (cleaned.indexOf(' - ') !== -1) {
          var parts = cleaned.split(' - ');
          return { song: parts[0].trim(), artist: parts[1].trim() };
        }
        var byIdx = cleaned.toLowerCase().lastIndexOf(' by ');
        if (byIdx > 0) {
          return { song: cleaned.slice(0, byIdx).trim(), artist: cleaned.slice(byIdx + 4).trim() };
        }
        return { song: cleaned, artist: '' };
      }

      function fetchSongMeaning(songTitle, artistName) {
        // Increment request id and abort any in-flight request
        try { if (requestRef.current.controller) { requestRef.current.controller.abort(); } } catch(e) {}
        var controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        var rid = (requestRef.current.id || 0) + 1;
        requestRef.current = { id: rid, controller: controller };

        var url = 'https://ur74xqz788.execute-api.us-east-1.amazonaws.com/prod/api/meaning?song=' + encodeURIComponent(songTitle);
        if (artistName) {
          url += '&artist=' + encodeURIComponent(artistName);
        }
        return fetch(url, controller ? { signal: controller.signal } : undefined).then(function(res) {
          if (!res.ok) throw new Error("not_found");
          return res.json();
        }).then(function(json){
          if (requestRef.current.id !== rid) { return Promise.reject(new Error('stale')); }
          return json;
        });
      }

      function handleSearch(overrideSong, overrideArtist) {
        var inputVal = (overrideSong != null ? overrideSong : song).trim();
        if (!inputVal) return;

        // Hard reset all UI state before new search
        setSong(inputVal);
        setResult(null);
        setIsLoading(true);
        setShowResult(true);

        var parsed = parseQuery(inputVal);
        var searchSong = overrideSong || parsed.song;
        var searchArtist = overrideArtist || parsed.artist;

        fetchSongMeaning(searchSong, searchArtist).then(function(data) {
          if (data.suggestion) {
            setResult({
              type: 'suggestion',
              originalSong: data.originalSong,
              correctedSong: data.correctedSong,
              suggestedArtist: data.suggestedArtist,
              songChanged: data.songChanged,
              message: data.message
            });
          } else if (data.meaning) {
            setResult({
              type: 'meaning',
              song: data.song,
              artist: data.artist,
              meaning: data.meaning
            });
          }
          setIsLoading(false);
        }).catch(function(error) {
          if (error && error.message === 'stale') { return; }
          setResult({
            type: 'error',
            message: 'Sorry, no songwriter meaning found. Try refining your search.'
          });
          setIsLoading(false);
        });
      }

      function handleSuggestionAccept(correctedSong, suggestedArtist) {
        // Update the search input to show what we're searching for
        setSong(correctedSong + ' - ' + suggestedArtist);

        // Ensure results panel is visible
        setShowResult(true);

        // Immediately set to loading state to clear the suggestion
        setResult({ type: 'loading' });
        setIsLoading(true);


        // Then do the search
        var parsed = parseQuery(correctedSong + ' - ' + suggestedArtist);
        var searchSong = correctedSong;
        var searchArtist = suggestedArtist;

        fetchSongMeaning(searchSong, searchArtist).then(function(data) {
          if (data.suggestion) {
            setResult({
              type: 'suggestion',
              originalSong: data.originalSong,
              correctedSong: data.correctedSong,
              suggestedArtist: data.suggestedArtist,
              songChanged: data.songChanged,
              message: data.message

          } else if (data.meaning) {
            setResult({
              type: 'meaning',
              song: data.song,
              artist: data.artist,
              meaning: data.meaning

          }
          setIsLoading(false);
        }).catch(function(error) {
          setResult({
            type: 'error',
            message: 'Sorry, no songwriter meaning found. Try refining your search.'
          });
          setIsLoading(false);
        });
      }

      function shareResult(songTitle, artistName) {
        var shareUrl = window.location.origin + '/?song=' + encodeURIComponent(songTitle) + '&artist=' + encodeURIComponent(artistName);
        var title = songTitle + ' by ' + artistName + ' - Song Meaning';

        if (navigator.share) {
          navigator.share({ title: title, url: shareUrl }).catch(function() {
            navigator.clipboard.writeText(shareUrl);
            alert('Link copied to clipboard!');
          });
        } else {
          navigator.clipboard.writeText(shareUrl);
          alert('Link copied to clipboard!');
        }
      }
