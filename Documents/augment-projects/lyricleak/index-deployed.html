      function createYouTubeEmbed(song, artist) {

        if (!videoId) {

      // Typing animation for placeholder (pause during loading/results to avoid jank)
      React.useEffect(function() {
        // Pause animation while input is focused, results visible, or loading
        if (isFocused || isLoading || showResult) {
          return function() {};
        }
        var i = 0;
        var j = 0;
        var deleting = false;
        var active = demoPhrases[0] || '';
        function tick() {
          if (!deleting) {
            setPlaceholder(active.slice(0, i + 1));
            i++;
            if (i >= active.length + 8) deleting = true;
          } else {
            setPlaceholder(active.slice(0, Math.max(0, i - 1)));
            i--;
            if (i <= 0) {
              deleting = false;
              j = (j + 1) % demoPhrases.length;
              active = demoPhrases[j];
            }
          }



        }
        var id = setInterval(tick, 65);
        return function() { clearInterval(id); };
      }, [isFocused, isLoading, showResult]);

      function parseQuery(text) {
        var t = (text || '').trim();
        if (!t) return { song: '', artist: '' };
        var cleaned = t.replace(/["""']/g, '').replace(/[–—]/g, '-');
        if (cleaned.indexOf(' - ') !== -1) {
          var parts = cleaned.split(' - ');
          return { song: parts[0].trim(), artist: parts[1].trim() };
        }
        var byIdx = cleaned.toLowerCase().lastIndexOf(' by ');
        if (byIdx > 0) {
          return { song: cleaned.slice(0, byIdx).trim(), artist: cleaned.slice(byIdx + 4).trim() };
        }
        return { song: cleaned, artist: '' };
      }

      function fetchSongMeaning(songTitle, artistName) {
        // Increment request id and abort any in-flight request so stale responses are ignored
        try { if (requestRef.current.controller) { requestRef.current.controller.abort(); } } catch(e) {}
        var controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        var rid = (requestRef.current.id || 0) + 1;
        requestRef.current = { id: rid, controller: controller };

        var url = 'https://ur74xqz788.execute-api.us-east-1.amazonaws.com/prod/api/meaning?song=' + encodeURIComponent(songTitle);
        if (artistName) {
          url += '&artist=' + encodeURIComponent(artistName);
        }
        return fetch(url, controller ? { signal: controller.signal } : undefined).then(function(res) {
          if (!res.ok) throw new Error("not_found");
          return res.json();
        }).then(function(json){
          // Ignore if a newer request was started
          if (requestRef.current.id !== rid) { return Promise.reject(new Error('stale')); }
          return json;
        });
      }

      function handleSearch(overrideSong, overrideArtist) {
        var inputVal = (overrideSong != null ? overrideSong : song).trim();
        if (!inputVal) return;

        // Hard reset all UI state before new search
        setSong(inputVal);
        setResult(null);
        setIsLoading(true);
        setShowResult(true);

        var parsed = parseQuery(inputVal);
        var searchSong = overrideSong || parsed.song;
        var searchArtist = overrideArtist || parsed.artist;

        fetchSongMeaning(searchSong, searchArtist).then(function(data) {
          if (data.suggestion) {
            setResult({
              type: 'suggestion',
              originalSong: data.originalSong,
              correctedSong: data.correctedSong,
              suggestedArtist: data.suggestedArtist,
              songChanged: data.songChanged,
              message: data.message
            });
          } else if (data.meaning) {
            setResult({
              type: 'meaning',
              song: data.song,
              artist: data.artist,
              meaning: data.meaning
            });
          }
          setIsLoading(false);
        }).catch(function(error) {
          if (error && error.message === 'stale') { return; }
          setResult({

            console.log('🧠 Agent reasoning:', result.reasoning);

    }






    // Update UI for a specific player
    function updatePlayerUI(playerId) {
      var player = window.audioPlayers[playerId];
      if (!player || typeof player.getDuration !== 'function') return;

      var cleanId = playerId.replace('audio-player-', '');
      var dur = player.getDuration() || 0;
      var cur = player.getCurrentTime() || 0;

      var durationEl = document.getElementById('duration-' + cleanId);
      var currentEl = document.getElementById('current-time-' + cleanId);
      var seekEl = document.getElementById('seek-' + cleanId);

      if (durationEl) durationEl.textContent = formatTime(dur);

      // Only update current time and seek bar if user isn't dragging
      var isSeeking = seekEl && seekEl.isSeeking && seekEl.isSeeking();
      if (!isSeeking) {
        if (currentEl) currentEl.textContent = formatTime(cur);
        if (seekEl && dur > 0) {
          var pct = Math.min(1000, Math.max(0, Math.round((cur / dur) * 1000)));
          seekEl.value = String(pct);
        }
      }
    }

    window.toggleAudioPlayer = function(playerId, btnId, searchQuery) {
      var btn = document.getElementById(btnId);
      var cleanId = playerId.replace('audio-player-', '');

      // Stop any currently playing audio
      if (window.currentPlayer && window.currentPlayer !== window.audioPlayers[playerId]) {
        window.currentPlayer.pauseVideo();
        if (window.updateTimers[window.currentPlayer.playerId]) {
          clearInterval(window.updateTimers[window.currentPlayer.playerId]);
        }
        // Update the previous player's button
        var prevCleanId = window.currentPlayer.playerId.replace('audio-player-', '');
        updatePlayPauseButton(prevCleanId, false);

      if (!window.audioPlayers[playerId]) {
        // Create new player with fresh search
        btn.innerHTML = '<svg viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: white;"><circle cx="12" cy="12" r="10" stroke="white" stroke-width="2" fill="none"/><path d="M12 6v6l4-2-4-2z"/></svg>';

            width: '0',

            playerVars: {
              playsinline: 1,
              autoplay: 0,
              controls: 0,
              modestbranding: 1,
              rel: 0
            },
            events: {
              'onReady': function(event) {
                // Restore the play/pause button with proper icons
                btn.innerHTML = '<svg id="play-icon-' + cleanId + '" viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: white; display: block;"><path d="M8 5v14l11-7z"/></svg><svg id="pause-icon-' + cleanId + '" viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: white; display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
                btn.disabled = false;
                console.log('Player ready for:', searchQuery);

                // Set up seek bar
                var seekEl = document.getElementById('seek-' + cleanId);
                if (seekEl) {
                  var isSeeking = false;

                  seekEl.addEventListener('mousedown', function() { isSeeking = true; });
                  seekEl.addEventListener('touchstart', function() { isSeeking = true; }, { passive: true });

                  seekEl.addEventListener('input', function(e) {
                    var player = window.audioPlayers[playerId];
                    var dur = player ? player.getDuration() : 0;
                    if (dur > 0) {
                      var pct = Number(e.target.value) / 1000;
                      var t = dur * pct;
                      var currentEl = document.getElementById('current-time-' + cleanId);
                      if (currentEl) currentEl.textContent = formatTime(t);
                    }
                  });

                  seekEl.addEventListener('change', function(e) {
                    var player = window.audioPlayers[playerId];
                    if (!player) return;
                    var dur = player.getDuration();
                    if (dur > 0) {
                      var pct = Number(e.target.value) / 1000;
                      var t = dur * pct;
