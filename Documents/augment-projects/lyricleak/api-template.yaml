AWSTemplateFormatVersion: '2010-09-09'
Description: 'LyricLeak API - Lambda + API Gateway'

Parameters:
  LambdaBucket:
    Type: String
    Description: S3 bucket containing the Lambda function code
  LambdaKey:
    Type: String
    Default: lambda-function.zip
    Description: S3 key for the Lambda function code
  OpenAIApiKey:
    Type: String
    NoEcho: true
    Description: OpenAI API Key for the smart agent
    Default: ""

Resources:
  # IAM Role for Lambda
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  # Lambda Function
  LyricLeakFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lyricleak-api
      Runtime: nodejs18.x
      Handler: server.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaBucket
        S3Key: !Ref LambdaKey
      Environment:
        Variables:
          OPENAI_API_KEY: !Ref OpenAIApiKey
      Timeout: 30
      MemorySize: 512

  # API Gateway
  LyricLeakApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: lyricleak-api
      Description: LyricLeak API Gateway
      EndpointConfiguration:
        Types:
          - REGIONAL

  # API Gateway Resource
  ApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref LyricLeakApi
      ParentId: !GetAtt LyricLeakApi.RootResourceId
      PathPart: api

  MeaningResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref LyricLeakApi
      ParentId: !Ref ApiResource
      PathPart: meaning

  # API Gateway Method
  MeaningMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref LyricLeakApi
      ResourceId: !Ref MeaningResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LyricLeakFunction.Arn}/invocations'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true

  # CORS Options Method
  OptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref LyricLeakApi
      ResourceId: !Ref MeaningResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true

  # Lambda Permission for API Gateway
  LambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LyricLeakFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${LyricLeakApi}/*/*'

  # API Gateway Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - MeaningMethod
      - OptionsMethod
    Properties:
      RestApiId: !Ref LyricLeakApi
      StageName: prod

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub 'https://${LyricLeakApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'
  
  LambdaFunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt LyricLeakFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaArn'
