<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LyricLeak</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' style='stop-color:%23ff6b4a'/><stop offset='100%25' style='stop-color:%23ff4757'/></linearGradient></defs><rect width='120' height='120' fill='%23000'/><circle cx='60' cy='45' r='15' fill='url(%23g)'/><path d='M60 60 Q50 70 60 80 Q70 70 60 60' fill='url(%23g)'/><text x='60' y='105' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-size='20' font-weight='bold'>LL</text></svg>">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #2c3e50 0%, #3b4a5c 100%);
      color: white;
      min-height: 100vh;
      overflow-x: auto;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: transparent; /* share page background */
      backdrop-filter: none;
      padding: 15px 30px;
      border-bottom: none;
    }

    body {
      font-family: 'Montserrat', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(180deg, #0b1024 0%, #0c132c 55%, #0a0f20 100%);
      background-attachment: fixed;
    }
    .headline { font-family: 'Montserrat', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-weight:800; letter-spacing:-0.02em; }
    .subtext { font-family: 'Montserrat', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-weight:400; }

    .logo {
      display: flex;
      align-items: center;
      color: white;
      text-decoration: none;
      gap: 12px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #ff6b4a, #ff4757);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }

    .logo-icon::before {
      content: '';
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 8px;
    }

    .logo-icon::after {
      content: '';
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 10px solid white;
      position: absolute;
      bottom: 6px;
    }

    .main-content {
      padding-top: 80px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-left: 20px;
      padding-right: 20px;
    }

    .hero {
      max-width: 900px;
      margin-bottom: 60px;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 30px;
      background: linear-gradient(135deg, #ff6b4a, #ff8a80);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 40px;
    }

    .search-container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #ff6b4a;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 3px rgba(255, 107, 74, 0.2);
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .search-button {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #ff6b4a, #ff4757);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .search-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255, 107, 74, 0.4);
    }

    .search-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .results {
      max-width: 800px;
      width: 100%;
      margin-top: 40px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: left;
      line-height: 1.7;
      font-size: 16px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s ease;
      display: none;
    }

    .results.show {
      opacity: 1;
      transform: translateY(0);
      display: block;
    }

    .thinking {
      text-align: center;
      padding: 40px 20px;
    }

    .thinking-icon {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 107, 74, 0.3);
      border-top: 3px solid #ff6b4a;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    .thinking-text {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 15px;
      display: block;
    }

    .thinking-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .thinking-dot {
      width: 8px;
      height: 8px;
      background: #ff6b4a;
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite both;
    }

    .thinking-dot:nth-child(1) { animation-delay: -0.32s; }
    .thinking-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    @media (max-width: 768px) {
      .header {
        padding: 12px 20px;
      }
      
      .logo {
        font-size: 24px;
      }
      
      .logo-icon {
        width: 35px;
        height: 35px;
      }
      
      .search-container {
        padding: 30px 25px;
        margin: 0 15px;
      }
      
      .main-content {
        padding-top: 70px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="/" class="logo" aria-label="LyricLeak home">
      <img src="lyricleak-logo.svg" alt="LyricLeak" style="height:56px;width:auto;display:block" />
    </a>
  </header>

  <main class="main-content">
    <div class="hero">
      <h1>Every song has a secret.</h1>
      <p>LyricLeak uncovers the real stories and hidden meanings behind the music you love, using AI to dig deeper than the surface.</p>
    </div>

    <div class="search-container">
      <div class="form-group">
        <label for="song">Song Title</label>
        <input type="text" id="song" placeholder="Enter song title..." autocomplete="off">
      </div>
      
      <div class="form-group">
        <label for="artist">Artist (optional)</label>
        <input type="text" id="artist" placeholder="Enter artist name..." autocomplete="off">
      </div>
      
      <button id="go" class="search-button">Find Song Meaning</button>
    </div>

    <div id="out" class="results"></div>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    // Auto-focus on song input
    $("song").focus();

    // Handle Enter key
    document.addEventListener("keydown", e => {
      if (e.key === "Enter" && !$("go").disabled) {
        $("go").click();
      }
    });

    // Main search functionality
    $("go").addEventListener("click", async () => {
      const song = $("song").value.trim();
      const artist = $("artist").value.trim();
      const out = $("out");

      if (!song) {
        $("song").focus();
        return;
      }

      $("go").disabled = true;

      // Show animated thinking state
      out.innerHTML = `
        <div class="thinking">
          <div class="thinking-icon"></div>
          <span class="thinking-text">Leaking the story behind the lyrics...</span>
          <div class="thinking-dots">
            <div class="thinking-dot"></div>
            <div class="thinking-dot"></div>
            <div class="thinking-dot"></div>
          </div>
        </div>
      `;
      out.classList.add("show");

      try {
        const result = await fetchSongMeaning(song, artist);
        if (result && typeof result === 'object' && result.suggestion) {
          // Show suggestion with option to search
          const correctedSong = result.correctedSong || result.song;
          const songChanged = result.songChanged;

          let correctionNote = '';
          if (songChanged) {
            correctionNote = `<div style="margin-bottom:10px;font-size:14px;opacity:0.8;color:#ccc;">
              <em>Corrected spelling: "${result.originalSong}" → "${correctedSong}"</em>
            </div>`;
          }

          out.innerHTML = `
            <div style="text-align:center;padding:20px 0;">
              ${correctionNote}
              <div style="margin-bottom:20px;font-size:16px;line-height:1.4;">
                ${result.message}
              </div>
              <button onclick="searchWithSuggestion('${correctedSong.replace(/'/g, "\\'")}', '${result.suggestedArtist.replace(/'/g, "\\'")}')"
                      style="background:#ff6b4a;color:white;border:none;padding:14px 28px;border-radius:8px;font-size:15px;cursor:pointer;transition:all 0.2s ease;font-weight:600;">
                Yes, search for "${correctedSong}" by ${result.suggestedArtist}
              </button>
              <div style="margin-top:15px;font-size:13px;opacity:0.7;">
                Or fill in the artist field manually and try again
              </div>
            </div>
          `;
        } else {
          // Display result
          out.innerHTML = result;
        }
      } catch (error) {
        console.error('Search error:', error);
        out.innerHTML = "Sorry, no songwriter meaning found. Try refining your search.";
      } finally { 
        $("go").disabled = false; 
      }
    });

    async function fetchSongMeaning(song, artist){
      let url = `https://ur74xqz788.execute-api.us-east-1.amazonaws.com/prod/api/meaning?song=${encodeURIComponent(song)}`;
      if (artist) {
        url += `&artist=${encodeURIComponent(artist)}`;
      }

      const res = await fetch(url);
      if (!res.ok) throw new Error("not_found");
      const data = await res.json();

      // If it's a suggestion response, return the whole object
      if (data.suggestion) {
        return data;
      }

      // Otherwise return just the meaning
      return data.meaning;
    }

    // Function to search with suggested artist
    window.searchWithSuggestion = async (song, artist) => {
      $("song").value = song;
      $("artist").value = artist;
      $("go").click();
    };

    // Handle URL parameters for direct links
    const urlParams = new URLSearchParams(window.location.search);
    const urlSong = urlParams.get('song');
    const urlArtist = urlParams.get('artist');
    
    if (urlSong) {
      $("song").value = urlSong;
      if (urlArtist) {
        $("artist").value = urlArtist;
      }
      // Auto-search after a brief delay
      setTimeout(() => $("go").click(), 500);
    }
  </script>
</body>
</html>
